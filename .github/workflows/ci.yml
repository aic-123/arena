name: CI

# 这个仓库的核心声称是「文档说的，代码真的做到了」。
# 那些声称落成了 checks.py 的 B1–B13 —— 没有 CI 的话，没有任何机器在守它们。
#
# 所以这里跑的**不是「测试通过」**，是「声明成立」：
#   · 四个测试套件证明行为没变
#   · checks.py 证明 13 条否证检查无命中
#   · 最后一条证明 checks.py 自己**不是空转**（往产物里注入真违规，看它响不响）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一条腿挂了不要掐掉别的腿 —— 要看清是哪个平台 / 哪个版本的问题。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]

    # 中文输出必须有 utf-8 才能打出来。
    #
    # Windows runner 的 `python` 默认 `sys.stdout.encoding` 是 **cp1252**，
    # 而这里每一条都会打中文（检查名 / `过` / `命中`）。撞上去的表现是
    # `UnicodeEncodeError` → 退出码 1 —— **和「有检查命中了」长得一模一样**。
    # 2026-09-26 实测踩到过：windows 两条腿报 exit 1，看起来像《选型声明》不成立。
    # 见 DECLARATION §18。
    #
    # 仓库里也自带 `_console.py`（各入口自己调），那管的是**用户直接跑**的场景。
    # 这一层管的是**这个 workflow 里所有步骤**，包括下面那些内联的 heredoc ——
    # 它们不走我们的模块，`_console.py` 罩不到。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 本仓库的 B7 声称「第三方依赖为零」。
      # 所以这里**故意不装任何包** —— 下面每一条都只用标准库。
      # 哪天有人加了个 import 第三方的，这一步之前就会红。
      - name: 确认零依赖（不装任何包）
        run: python -c "import sys; print('Python', sys.version)"

      - name: 结构与不变量
        run: python test_arena.py

      - name: 入口那一面（子进程 + 真 stdin + 真库）
        run: python test_cli.py

      - name: 样本折算判据
        run: python samples/test_align.py

      - name: 证明 checks.py 不是空转（注入真违规，看它响不响）
        run: python test_checks.py

      - name: 否证检查 B1–B13（退出码 0 = 全部声明成立）
        run: python checks.py

      # ⚠️ 这一条**故意不是**「跑一下看它崩不崩」。
      #
      # 并发装置的退出码**永远是 0** —— 「本轮未暴露」按 §T2 第 11 步是**有效结果**，
      # 不是失败。所以「跑通了」在这里等于什么都没证明（恒绿的断言也是绿的）。
      #
      # 真正有意义的断言是那一条：**换手次数 > 0**。
      # 4 个进程如果其实是排队跑完的，一条异常也不会有，而那样的「未暴露」
      # 是**一句没有分母的结论** —— 这正是这个仓库一直在防的那个形状。
      #
      # ⚠️⚠️ 2026-09-26 修正：这里原来还有一条 `if r["异常"]: fail`。**那条是错的。**
      #
      # 它把「异常数」当成了通过判据，而 §C11.2 的原话是：
      # **异常不是失败 —— 异常正是本步要找的东西。**
      # 「一轮跑完没暴露问题，如实汇报『本轮未暴露』」—— 反过来，
      # 一轮**暴露了**问题，那是装置**干了活**，不是装置坏了。
      #
      # 那条断言实际在测的是**跑它的机器够不够快**：本机 16 核跑 4×6 稳定 0 异常，
      # 压到 8×12 就复现出 96 个 `database is locked`；
      # GitHub 的 windows runner 只有 2~4 核，于是 4×6 就撞。**同码不同芯，结论相反。**
      # 那正是本仓库这个月第四次踩同一个形状 ——
      # 把一个「运行环境恰好怎样」的性质，混进了「产物是否成立」的结论里。
      #
      # 而且 `database is locked` 是**已经记在案的未决风险**（DECLARATION §9.4）：
      # 原子发号拿写锁，领号到 commit 之间别的写者进不来。当时拍板
      # 「不预先引入机制」（§T5），所以它**本来就该被跑出来**。
      #
      # 改法：判据只看**有分母**（换手 > 0）+ **没有进程级崩溃**。
      # 异常数照实打印，不判红 —— 它是**读数**，不是**判据**。
      # 同时把参数从 4×6 提到 **8×12**：既然 locked 是已知的未决风险，
      # 就该让它**稳定地暴露出来**，而不是偶尔红一次让人以为是抖动。
      # 「一个已知的风险，要么稳定地被看见，要么稳定地被修掉 —— 不要让它飘。」
      - name: 并发装置真的并发了（不是恒绿）
        # windows runner 默认是 PowerShell，heredoc 是 bash 语法 —— 必须显式指定。
        shell: bash
        run: |
          python - <<'PY'
          import concurrency

          r = concurrency.run(8, 12)
          inter = r["交错"]
          print(f"动作 {len(r['logs'])} 次，异常 {len(r['异常'])} 次，"
                f"换手 {inter['换手次数']} 次，最长连续段 {inter['最长连续段']}")

          # 异常按类型分组照实打印 —— 这是读数。
          kinds = {}
          for x in r["异常"]:
              k = x["异常类型"] + " :: " + x["异常消息"][:70]
              kinds[k] = kinds.get(k, 0) + 1
          for k, n in sorted(kinds.items(), key=lambda kv: -kv[1]):
              print(f"    [异常] x{n}  {k}")
          if kinds:
              print("    以上是**暴露出来的现象**，不是失败 —— 见 §C11.2 与 DECLARATION §9.4。")

          # 判据只有两条：真的交错了，且没有进程级崩溃。
          fail = []
          if r["crashes"]:
              fail.append(f"有进程崩了：{r['crashes']}")
          if inter["换手次数"] == 0:
              fail.append("换手 0 次 —— 进程没有真正交错，这次结果没有分母，不算证据")
          if fail:
              print("::error::CONC-FAIL " + " ;; ".join(fail))
              print("::error::CONC-STATS 动作=%d 异常=%d 换手=%d 段=%d"
                    % (len(r['logs']), len(r['异常']),
                       inter['换手次数'], inter['最长连续段']))
              raise SystemExit("\n".join(fail))

          print("并发装置：跑起来了，而且真的交错了（有分母）。")
          PY

      # 本仓库有一条自己的纪律：测试不许留下探针文件。
      # 曾经漏掉的那一种是 .pyc（编译过的探针），所以这里按**名字**找，
      # 不按后缀找 —— 找的是 `_tmp_probe*` 这个前缀下的一切。
      - name: 不许留下探针
        shell: bash
        run: |
          left=$(find . -name '_tmp_probe*' -not -path './.git/*' | wc -l)
          echo "残留探针：$left"
          if [ "$left" -ne 0 ]; then
            find . -name '_tmp_probe*' -not -path './.git/*'
            echo "::error::测试留下了探针文件"
            exit 1
          fi
